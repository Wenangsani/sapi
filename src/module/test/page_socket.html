<!DOCTYPE html>
<html lang="id">
<head>
  <meta charset="UTF-8" />
  <meta name="viewport" content="width=device-width, initial-scale=1.0" />
  <title>Tes Socket — WebSocket Tester</title>
  <script src="https://cdn.tailwindcss.com"></script>
  <script src="https://unpkg.com/petite-vue@0.4.1/dist/petite-vue.iife.js"></script>
  <style>
    [v-cloak] { display: none; }
    .log-box { scrollbar-width: thin; scrollbar-color: #d1d5db transparent; }
    .log-box::-webkit-scrollbar { width: 4px; }
    .log-box::-webkit-scrollbar-thumb { background: #d1d5db; border-radius: 2px; }
    @keyframes pulse-dot { 0%,100%{opacity:1} 50%{opacity:.4} }
    .pulse { animation: pulse-dot 1.4s ease-in-out infinite; }
    .font-mono-data { font-family: ui-monospace, 'Cascadia Code', 'Fira Code', monospace; }
  </style>
</head>
<body class="bg-gray-50 min-h-screen text-gray-800 antialiased" v-scope v-cloak>

  <!-- Header -->
  <header class="bg-white border-b border-gray-200 px-4 py-3 flex items-center gap-3 sticky top-0 z-10">
    <div class="flex items-center gap-2">
      <span class="text-xs font-semibold tracking-widest uppercase text-gray-400">Dev Tool</span>
      <span class="text-gray-200">/</span>
      <span class="text-sm font-semibold text-gray-700">WebSocket Tester</span>
    </div>
    <div class="ml-auto flex items-center gap-2">
      <span :class="connected ? 'bg-emerald-500 pulse' : 'bg-gray-300'" class="inline-block w-2 h-2 rounded-full"></span>
      <span class="text-xs font-medium" :class="connected ? 'text-emerald-600' : 'text-gray-400'">
        {{ connected ? 'Connected' : 'Disconnected' }}
      </span>
    </div>
  </header>

  <!-- Main Layout -->
  <div class="max-w-5xl mx-auto px-4 py-6 flex flex-col gap-5">

    <!-- URL Bar -->
    <div class="bg-white rounded-xl border border-gray-200 p-4 flex flex-col sm:flex-row gap-3">
      <div class="flex-1 flex items-center gap-2 bg-gray-50 border border-gray-200 rounded-lg px-3 py-2 focus-within:border-blue-400 focus-within:ring-1 focus-within:ring-blue-100 transition">
        <span class="text-xs text-gray-400 font-mono-data font-semibold shrink-0">WS</span>
        <input
          type="text"
          v-model="url"
          :disabled="connected"
          placeholder="ws://localhost:8080/ws"
          class="bg-transparent flex-1 text-sm font-mono-data text-gray-700 outline-none placeholder-gray-300 disabled:opacity-50"
        />
      </div>
      <div class="flex gap-2">
        <button
          @click="connect"
          :disabled="connected"
          class="flex-1 sm:flex-none px-5 py-2 rounded-lg text-sm font-medium bg-blue-600 text-white hover:bg-blue-700 active:scale-95 transition disabled:opacity-40 disabled:cursor-not-allowed"
        >Connect</button>
        <button
          @click="disconnect"
          :disabled="!connected"
          class="flex-1 sm:flex-none px-5 py-2 rounded-lg text-sm font-medium bg-white border border-gray-200 text-red-500 hover:bg-red-50 active:scale-95 transition disabled:opacity-40 disabled:cursor-not-allowed"
        >Disconnect</button>
      </div>
    </div>

    <!-- Stats Row -->
    <div class="grid grid-cols-3 gap-3">
      <div class="bg-white rounded-xl border border-gray-200 px-4 py-3 text-center">
        <p class="text-xs text-gray-400 mb-1">Dikirim</p>
        <p class="text-2xl font-semibold text-gray-700 font-mono-data" v-text="sentCount"></p>
      </div>
      <div class="bg-white rounded-xl border border-gray-200 px-4 py-3 text-center">
        <p class="text-xs text-gray-400 mb-1">Diterima</p>
        <p class="text-2xl font-semibold text-emerald-600 font-mono-data" v-text="recvCount"></p>
      </div>
      <div class="bg-white rounded-xl border border-gray-200 px-4 py-3 text-center">
        <p class="text-xs text-gray-400 mb-1">Error</p>
        <p class="text-2xl font-semibold text-red-500 font-mono-data" v-text="errCount"></p>
      </div>
    </div>

    <!-- Log Panel -->
    <div class="bg-white rounded-xl border border-gray-200 overflow-hidden">
      <div class="flex items-center justify-between px-4 py-2.5 border-b border-gray-100">
        <span class="text-xs font-semibold text-gray-500 uppercase tracking-wider">Log</span>
        <button @click="clearLogs" class="text-xs text-gray-400 hover:text-gray-600 transition px-2 py-1 rounded hover:bg-gray-50">Hapus</button>
      </div>
      <div class="log-box h-72 overflow-y-auto px-4 py-3 space-y-1 bg-gray-950">
        <p v-if="logs.length === 0" class="text-xs text-gray-600 italic pt-2">
          Belum ada aktivitas. Hubungkan ke server untuk memulai.
        </p>
        <div v-for="l in logs" class="flex gap-3 items-start font-mono-data text-xs leading-5">
          <span class="text-gray-600 shrink-0 pt-px">{{ l.time }}</span>
          <span
            class="shrink-0 w-4 text-center font-bold pt-px"
            :class="{
              'text-blue-400': l.dir === 'in',
              'text-emerald-400': l.dir === 'out',
              'text-yellow-500': l.dir === 'sys',
              'text-red-400': l.dir === 'err'
            }"
          >{{ l.dir === 'in' ? '↙' : l.dir === 'out' ? '↗' : l.dir === 'err' ? '✕' : '·' }}</span>
          <span
            class="break-all"
            :class="{
              'text-blue-300': l.dir === 'in',
              'text-emerald-300': l.dir === 'out',
              'text-yellow-400': l.dir === 'sys',
              'text-red-400': l.dir === 'err'
            }"
            v-text="l.msg"
          ></span>
        </div>
      </div>
    </div>

    <!-- Send Panel -->
    <div class="bg-white rounded-xl border border-gray-200 p-4">
      <p class="text-xs font-semibold text-gray-400 uppercase tracking-wider mb-3">Kirim Pesan</p>

      <!-- Presets -->
      <div class="flex flex-wrap gap-2 mb-3">
        <button
          v-for="p in presets"
          @click="sendPreset(p.val)"
          :disabled="!connected"
          class="px-3 py-1 text-xs rounded-lg border border-gray-200 text-gray-600 hover:border-blue-300 hover:text-blue-600 hover:bg-blue-50 active:scale-95 transition disabled:opacity-40 disabled:cursor-not-allowed font-mono-data"
          v-text="p.label"
        ></button>
      </div>

      <!-- Textarea + Send -->
      <div class="flex gap-3">
        <textarea
          v-model="message"
          @keydown="onKeydown"
          :disabled="!connected"
          placeholder="Ketik pesan... (Enter kirim · Shift+Enter baris baru)"
          rows="3"
          class="flex-1 resize-none bg-gray-50 border border-gray-200 rounded-lg px-3 py-2 text-sm font-mono-data text-gray-700 outline-none placeholder-gray-300 focus:border-blue-400 focus:ring-1 focus:ring-blue-100 transition disabled:opacity-50"
        ></textarea>
        <div class="flex flex-col gap-2 justify-center">
          <button
            @click="send"
            :disabled="!connected || !message.trim()"
            class="px-5 py-2 rounded-lg text-sm font-medium bg-blue-600 text-white hover:bg-blue-700 active:scale-95 transition disabled:opacity-40 disabled:cursor-not-allowed"
          >Kirim</button>
          <button
            @click="message = ''"
            :disabled="!message"
            class="px-5 py-2 rounded-lg text-sm font-medium border border-gray-200 text-gray-500 hover:bg-gray-50 active:scale-95 transition disabled:opacity-40 disabled:cursor-not-allowed"
          >Reset</button>
        </div>
      </div>
    </div>

  </div><!-- /max-w -->

  <script>
    PetiteVue.createApp({
      url: `ws://${location.host}/conn/ws`,
      ws: null,
      connected: false,
      logs: [],
      message: '',
      sentCount: 0,
      recvCount: 0,
      errCount: 0,
      presets: [
        { label: 'hello',               val: 'hello' },
        { label: 'ping',                val: 'ping' },
        { label: '{"type":"broadcast"}', val: '{"type":"broadcast","data":"test"}' },
        { label: 'echo test',           val: 'echo test 123' },
      ],

      now() {
        return new Date().toLocaleTimeString('id-ID', { hour12: false });
      },

      addLog(dir, msg) {
        this.logs.push({ time: this.now(), dir, msg });
        this.$nextTick(() => {
          const box = document.querySelector('.log-box');
          if (box) box.scrollTop = box.scrollHeight;
        });
      },

      connect() {
        if (this.ws) this.ws.close();
        try {
          this.ws = new WebSocket(this.url);
          this.addLog('sys', `Menghubungkan ke ${this.url}…`);

          this.ws.onopen = () => {
            this.connected = true;
            this.addLog('sys', 'Koneksi berhasil');
          };

          this.ws.onmessage = (e) => {
            this.recvCount++;
            this.addLog('in', typeof e.data === 'string' ? e.data : `[binary: ${e.data.size} bytes]`);
          };

          this.ws.onclose = (e) => {
            this.connected = false;
            this.addLog('sys', `Koneksi ditutup (code: ${e.code})`);
            this.ws = null;
          };

          this.ws.onerror = () => {
            this.errCount++;
            this.addLog('err', 'Error koneksi — pastikan backend aktif di ' + this.url);
          };
        } catch (e) {
          this.errCount++;
          this.addLog('err', `Error: ${e.message}`);
        }
      },

      disconnect() {
        if (this.ws) this.ws.close(1000, 'Client disconnect');
      },

      send() {
        const msg = this.message.trim();
        if (!this.ws || !this.connected || !msg) return;
        this.ws.send(msg);
        this.addLog('out', msg);
        this.sentCount++;
        this.message = '';
      },

      sendPreset(val) {
        if (!this.ws || !this.connected) return;
        this.ws.send(val);
        this.addLog('out', val);
        this.sentCount++;
      },

      clearLogs() {
        this.logs = [];
        this.sentCount = 0;
        this.recvCount = 0;
        this.errCount = 0;
      },

      onKeydown(e) {
        if (e.key === 'Enter' && !e.shiftKey) {
          e.preventDefault();
          this.send();
        }
      }
    }).mount('body');
  </script>
</body>
</html>
