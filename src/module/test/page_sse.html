<!DOCTYPE html>
<html lang="id">
<head>
    <meta charset="UTF-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1.0" />
    <title>Chat</title>
    <script src="https://cdn.tailwindcss.com"></script>
    <style>
        * { box-sizing: border-box; }

        html, body {
            height: 100%;
            margin: 0;
            font-family: -apple-system, BlinkMacSystemFont, 'Segoe UI', sans-serif;
            background: #f5f5f4;
        }

        #app {
            display: flex;
            flex-direction: column;
            height: 100dvh;
            max-width: 680px;
            margin: 0 auto;
            background: #fff;
            border-left: 1px solid #e7e5e4;
            border-right: 1px solid #e7e5e4;
        }

        /* Header */
        #header {
            display: flex;
            align-items: center;
            gap: 10px;
            padding: 12px 16px;
            background: #fff;
            border-bottom: 1px solid #e7e5e4;
            flex-shrink: 0;
        }

        #header-avatar {
            width: 36px;
            height: 36px;
            border-radius: 50%;
            background: #4f46e5;
            display: flex;
            align-items: center;
            justify-content: center;
            flex-shrink: 0;
        }

        /* Setup modal */
        #setup-overlay {
            position: fixed;
            inset: 0;
            background: rgba(0,0,0,0.45);
            display: flex;
            align-items: center;
            justify-content: center;
            z-index: 50;
            padding: 16px;
        }

        #setup-card {
            background: #fff;
            border-radius: 16px;
            padding: 28px 24px;
            width: 100%;
            max-width: 360px;
            box-shadow: 0 8px 32px rgba(0,0,0,.12);
        }

        /* Messages */
        #msgs {
            flex: 1;
            overflow-y: auto;
            padding: 16px;
            display: flex;
            flex-direction: column;
            gap: 10px;
        }

        #msgs::-webkit-scrollbar { width: 4px; }
        #msgs::-webkit-scrollbar-thumb { background: #d6d3d1; border-radius: 99px; }

        .msg-row { display: flex; gap: 8px; align-items: flex-end; }
        .msg-row.me { flex-direction: row-reverse; }

        .msg-av {
            width: 28px;
            height: 28px;
            border-radius: 50%;
            flex-shrink: 0;
            display: flex;
            align-items: center;
            justify-content: center;
            font-size: 11px;
            font-weight: 600;
            color: #fff;
        }

        .msg-wrap { display: flex; flex-direction: column; max-width: 74%; }
        .msg-row.me .msg-wrap { align-items: flex-end; }

        .msg-name {
            font-size: 11px;
            color: #78716c;
            margin-bottom: 3px;
            padding: 0 4px;
        }

        .msg-bubble {
            padding: 8px 13px;
            font-size: 14px;
            line-height: 1.55;
            word-break: break-word;
            white-space: pre-wrap;
        }

        .msg-bubble.them {
            background: #f5f5f4;
            color: #1c1917;
            border-radius: 16px 16px 16px 4px;
            border: 1px solid #e7e5e4;
        }

        .msg-bubble.me {
            background: #4f46e5;
            color: #fff;
            border-radius: 16px 16px 4px 16px;
        }

        .msg-time {
            font-size: 10px;
            color: #a8a29e;
            padding: 0 4px;
            margin-top: 3px;
        }

        /* Typing indicator */
        .typing-dot {
            width: 6px; height: 6px;
            background: #a8a29e;
            border-radius: 50%;
            display: inline-block;
            animation: bounce 1.2s infinite;
        }
        .typing-dot:nth-child(2) { animation-delay: .2s; }
        .typing-dot:nth-child(3) { animation-delay: .4s; }

        @keyframes bounce {
            0%, 80%, 100% { transform: translateY(0); }
            40% { transform: translateY(-5px); }
        }

        /* Footer */
        #footer {
            padding: 10px 12px;
            background: #fff;
            border-top: 1px solid #e7e5e4;
            display: flex;
            gap: 8px;
            align-items: flex-end;
            flex-shrink: 0;
        }

        #input-box {
            flex: 1;
            resize: none;
            border: 1px solid #d6d3d1;
            border-radius: 20px;
            padding: 8px 14px;
            font-size: 14px;
            font-family: inherit;
            background: #fafaf9;
            color: #1c1917;
            outline: none;
            line-height: 1.5;
            max-height: 120px;
            overflow-y: auto;
            transition: border-color .15s, box-shadow .15s;
        }

        #input-box:focus {
            border-color: #4f46e5;
            box-shadow: 0 0 0 3px rgba(79,70,229,.12);
            background: #fff;
        }

        #send-btn {
            width: 38px;
            height: 38px;
            border-radius: 50%;
            background: #4f46e5;
            border: none;
            cursor: pointer;
            display: flex;
            align-items: center;
            justify-content: center;
            flex-shrink: 0;
            transition: opacity .15s, transform .1s, background .15s;
        }

        #send-btn:hover:not(:disabled) { background: #4338ca; }
        #send-btn:active:not(:disabled) { transform: scale(.92); }
        #send-btn:disabled { opacity: .35; cursor: default; }

        /* Toast */
        #toast {
            position: fixed;
            bottom: 80px;
            left: 50%;
            transform: translateX(-50%) translateY(8px);
            background: #1c1917;
            color: #fff;
            font-size: 13px;
            padding: 8px 16px;
            border-radius: 99px;
            opacity: 0;
            transition: opacity .2s, transform .2s;
            pointer-events: none;
            white-space: nowrap;
            z-index: 99;
        }

        #toast.show {
            opacity: 1;
            transform: translateX(-50%) translateY(0);
        }

        /* Status dot */
        .dot { display: inline-block; width: 7px; height: 7px; border-radius: 50%; margin-right: 4px; }
        .dot.green { background: #22c55e; }
        .dot.red { background: #ef4444; animation: pulse-red 1.5s infinite; }
        .dot.yellow { background: #eab308; }

        @keyframes pulse-red {
            0%, 100% { opacity: 1; } 50% { opacity: .4; }
        }
    </style>
</head>
<body>

<!-- Setup overlay: masukkan nama -->
<div id="setup-overlay">
    <div id="setup-card">
        <p style="font-size:20px;font-weight:600;color:#1c1917;margin-bottom:6px">Masuk ke chat</p>
        <p style="font-size:14px;color:#78716c;margin-bottom:20px">Pilih nama yang akan ditampilkan ke semua orang.</p>
        <input
            id="name-input"
            type="text"
            placeholder="Nama kamu"
            maxlength="32"
            style="width:100%;padding:10px 14px;border:1px solid #d6d3d1;border-radius:10px;font-size:14px;outline:none;margin-bottom:12px;font-family:inherit;color:#1c1917"
            autofocus
        />
        <button
            id="join-btn"
            style="width:100%;padding:10px;background:#4f46e5;color:#fff;border:none;border-radius:10px;font-size:14px;font-weight:500;cursor:pointer"
        >Masuk</button>
    </div>
</div>

<div id="app">
    <!-- Header -->
    <div id="header">
        <div id="header-avatar">
            <svg width="18" height="18" fill="none" stroke="#fff" stroke-width="2" stroke-linecap="round" stroke-linejoin="round" viewBox="0 0 24 24">
                <path d="M21 15a2 2 0 0 1-2 2H7l-4 4V5a2 2 0 0 1 2-2h14a2 2 0 0 1 2 2z"/>
            </svg>
        </div>
        <div style="flex:1">
            <p style="font-size:14px;font-weight:600;color:#1c1917;line-height:1.2">Ruang Chat</p>
            <p style="font-size:12px;line-height:1.2;margin-top:2px" id="conn-status">
                <span class="dot yellow"></span><span>Menghubungkan…</span>
            </p>
        </div>
        <p style="font-size:12px;color:#a8a29e" id="my-name-label"></p>
    </div>

    <!-- Messages -->
    <div id="msgs">
        <div id="empty-state" style="flex:1;display:flex;flex-direction:column;align-items:center;justify-content:center;padding:40px 0;color:#a8a29e;gap:8px;text-align:center">
            <svg width="40" height="40" fill="none" stroke="currentColor" stroke-width="1.5" viewBox="0 0 24 24">
                <path stroke-linecap="round" stroke-linejoin="round" d="M8 10h.01M12 10h.01M16 10h.01M21 15a2 2 0 01-2 2H7l-4 4V5a2 2 0 012-2h14a2 2 0 012 2v10z"/>
            </svg>
            <p style="font-size:14px">Belum ada pesan. Mulai percakapan!</p>
        </div>
    </div>

    <!-- Footer -->
    <div id="footer">
        <textarea
            id="input-box"
            rows="1"
            placeholder="Tulis pesan… (Enter kirim, Shift+Enter baris baru)"
            disabled
        ></textarea>
        <button id="send-btn" disabled aria-label="Kirim">
            <svg width="16" height="16" fill="none" stroke="#fff" stroke-width="2.5" stroke-linecap="round" stroke-linejoin="round" viewBox="0 0 24 24">
                <line x1="22" y1="2" x2="11" y2="13"/><polygon points="22 2 15 22 11 13 2 9 22 2"/>
            </svg>
        </button>
    </div>
</div>

<!-- Toast -->
<div id="toast"></div>

<script>
// ── Helpers ──────────────────────────────────────────────────────────────────

const COLORS = [
    '#4f46e5','#0891b2','#059669','#d97706',
    '#dc2626','#7c3aed','#db2777','#0284c7',
    '#16a34a','#ca8a04','#9333ea','#0e7490',
];

function strHash(s) {
    let h = 0;
    for (let i = 0; i < s.length; i++) h = (Math.imul(31, h) + s.charCodeAt(i)) | 0;
    return Math.abs(h);
}

function avatarColor(name) {
    return COLORS[strHash(name) % COLORS.length];
}

function formatTime(date) {
    return date.toLocaleTimeString('id-ID', { hour: '2-digit', minute: '2-digit' });
}

function showToast(msg, duration = 3000) {
    const t = document.getElementById('toast');
    t.textContent = msg;
    t.classList.add('show');
    setTimeout(() => t.classList.remove('show'), duration);
}

// ── State ────────────────────────────────────────────────────────────────────

let myName    = '';
let es        = null;
let sending   = false;

const setupOverlay = document.getElementById('setup-overlay');
const nameInput    = document.getElementById('name-input');
const joinBtn      = document.getElementById('join-btn');
const msgs         = document.getElementById('msgs');
const emptyState   = document.getElementById('empty-state');
const inputBox     = document.getElementById('input-box');
const sendBtn      = document.getElementById('send-btn');
const connStatus   = document.getElementById('conn-status');
const myNameLabel  = document.getElementById('my-name-label');

// ── Setup ────────────────────────────────────────────────────────────────────

function joinChat() {
    const name = nameInput.value.trim();
    if (!name) { nameInput.focus(); return; }
    myName = name;
    setupOverlay.style.display = 'none';
    myNameLabel.textContent    = name;
    connectSSE();
}

joinBtn.addEventListener('click', joinChat);
nameInput.addEventListener('keydown', e => { if (e.key === 'Enter') joinChat(); });

// ── SSE ──────────────────────────────────────────────────────────────────────

function setStatus(state) {
    const map = {
        connecting: { dot: 'yellow', text: 'Menghubungkan…' },
        online:     { dot: 'green',  text: 'Online' },
        offline:    { dot: 'red',    text: 'Terputus — mencoba ulang…' },
    };
    const { dot, text } = map[state] || map.connecting;
    connStatus.innerHTML = `<span class="dot ${dot}"></span><span>${text}</span>`;

    const ready = state === 'online';
    inputBox.disabled = !ready;
    sendBtn.disabled  = !ready || !inputBox.value.trim();
}

function connectSSE() {
    if (es) es.close();
    setStatus('connecting');

    es = new EventSource('/conn/sse', { withCredentials: true });

    es.onopen = () => setStatus('online');

    es.onmessage = (e) => {
        try {
            const msg = JSON.parse(e.data);
            // Abaikan pesan sendiri yang balik via SSE agar tidak duplikasi
            // (kita sudah render optimistic saat kirim)
            if (msg._from === myName) return;
            appendMessage(msg._from, msg.message, new Date());
        } catch {
            // bukan JSON, abaikan
        }
    };

    es.onerror = () => {
        setStatus('offline');
        es.close();
        setTimeout(connectSSE, 3000);
    };
}

// ── Render pesan ─────────────────────────────────────────────────────────────

function appendMessage(from, text, time) {
    if (emptyState.parentNode) emptyState.remove();

    const isMe = from === myName;
    const color = avatarColor(from);

    const row  = document.createElement('div');
    row.className = 'msg-row' + (isMe ? ' me' : '');

    const av = document.createElement('div');
    av.className = 'msg-av';
    av.style.background = color;
    av.textContent = from[0].toUpperCase();

    const wrap = document.createElement('div');
    wrap.className = 'msg-wrap';

    if (!isMe) {
        const nameEl = document.createElement('div');
        nameEl.className = 'msg-name';
        nameEl.textContent = from;
        wrap.appendChild(nameEl);
    }

    const bubble = document.createElement('div');
    bubble.className = 'msg-bubble ' + (isMe ? 'me' : 'them');
    bubble.textContent = text;

    const ts = document.createElement('div');
    ts.className = 'msg-time';
    ts.textContent = formatTime(time);

    wrap.appendChild(bubble);
    wrap.appendChild(ts);
    row.appendChild(av);
    row.appendChild(wrap);

    msgs.appendChild(row);
    msgs.scrollTop = msgs.scrollHeight;
}

// ── Kirim pesan ──────────────────────────────────────────────────────────────

async function sendMessage() {
    const text = inputBox.value.trim();
    if (!text || sending) return;

    sending = true;
    sendBtn.disabled = true;

    // Render optimistic — tampil langsung tanpa tunggu server
    appendMessage(myName, text, new Date());
    inputBox.value = '';
    inputBox.style.height = 'auto';

    try {
        const res = await fetch('/conn/sse/send', {
            method:      'POST',
            credentials: 'include',
            headers:     { 'Content-Type': 'application/json' },
            body:        JSON.stringify({
                message: text,
                _from:   myName,         // metadata nama, dibaca oleh client SSE lain
            }),
        });

        if (!res.ok) {
            const data = await res.json().catch(() => ({}));
            showToast('Gagal kirim: ' + (data.message || res.status));
        }
    } catch (err) {
        showToast('Tidak dapat terhubung ke server');
    } finally {
        sending = false;
        sendBtn.disabled = !inputBox.value.trim();
    }
}

sendBtn.addEventListener('click', sendMessage);

inputBox.addEventListener('keydown', e => {
    if (e.key === 'Enter' && !e.shiftKey) {
        e.preventDefault();
        sendMessage();
    }
});

inputBox.addEventListener('input', () => {
    sendBtn.disabled = !inputBox.value.trim() || sending;
    inputBox.style.height = 'auto';
    inputBox.style.height = Math.min(inputBox.scrollHeight, 120) + 'px';
});
</script>
</body>
</html>
