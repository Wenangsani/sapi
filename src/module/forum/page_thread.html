<!DOCTYPE html>
<html lang="id">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Thread</title>
    <script src="https://cdn.tailwindcss.com"></script>
    <script src="https://unpkg.com/petite-vue@0.4.1/dist/petite-vue.iife.js"></script>
</head>
<body class="bg-stone-50 text-stone-800 min-h-screen font-sans" v-scope>

    <!-- Toast -->
    <div v-if="toast.show"
         :class="toast.type === 'error' ? 'bg-red-600' : 'bg-orange-500'"
         class="fixed top-4 right-4 z-[100] text-white px-5 py-3 rounded-lg shadow-lg text-sm transition-all">
        {{ toast.message }}
    </div>

    <!-- Header -->
    <header class="bg-white border-b border-stone-200 sticky top-0 z-50">
        <div class="max-w-3xl mx-auto px-4 py-4 flex items-center gap-3">
            <a href="/forum" class="text-stone-400 hover:text-orange-500 transition">
                <svg class="w-5 h-5" fill="none" stroke="currentColor" stroke-width="2" viewBox="0 0 24 24"><path stroke-linecap="round" stroke-linejoin="round" d="M15.75 19.5L8.25 12l7.5-7.5"/></svg>
            </a>
            <h1 v-if="thread" class="text-base font-semibold text-stone-900 truncate flex-1">{{ thread.title }}</h1>
            <div v-else class="flex-1 h-5 bg-stone-200 rounded animate-pulse"></div>
        </div>
    </header>

    <main class="max-w-3xl mx-auto px-4 py-6">

        <!-- Loading -->
        <div v-if="loading" class="space-y-4">
            <div class="bg-white rounded-xl p-6 space-y-4">
                <div class="h-6 bg-stone-200 rounded w-3/4 animate-pulse"></div>
                <div class="h-4 bg-stone-100 rounded w-1/3 animate-pulse"></div>
                <div class="space-y-2 mt-4">
                    <div class="h-4 bg-stone-100 rounded animate-pulse"></div>
                    <div class="h-4 bg-stone-100 rounded w-5/6 animate-pulse"></div>
                    <div class="h-4 bg-stone-100 rounded w-2/3 animate-pulse"></div>
                </div>
            </div>
        </div>

        <!-- Password Required -->
        <div v-else-if="passwordRequired" class="bg-white rounded-2xl p-8 text-center shadow-sm border border-stone-200">
            <div class="w-16 h-16 bg-amber-100 rounded-2xl flex items-center justify-center mx-auto mb-4">
                <svg class="w-8 h-8 text-amber-600" fill="none" stroke="currentColor" stroke-width="1.5" viewBox="0 0 24 24">
                    <path stroke-linecap="round" stroke-linejoin="round" d="M16.5 10.5V6.75a4.5 4.5 0 10-9 0v3.75m-.75 11.25h10.5a2.25 2.25 0 002.25-2.25v-6.75a2.25 2.25 0 00-2.25-2.25H6.75a2.25 2.25 0 00-2.25 2.25v6.75a2.25 2.25 0 002.25 2.25z"/>
                </svg>
            </div>
            <h2 class="text-lg font-bold text-stone-900 mb-1">{{ passwordTitle }}</h2>
            <p class="text-sm text-stone-500 mb-6">Thread ini dilindungi password. Masukkan password untuk melihat konten.</p>
            <div class="max-w-xs mx-auto">
                <input v-model="passwordInput" type="password" placeholder="Masukkan password..."
                       @keyup.enter="submitPassword()"
                       class="w-full px-4 py-2.5 border border-stone-200 rounded-lg text-sm text-center focus:outline-none focus:ring-2 focus:ring-orange-500/30 focus:border-orange-400 mb-3">
                <button @click="submitPassword()" :disabled="passwordLoading"
                        :class="passwordLoading ? 'opacity-60' : 'hover:bg-orange-600'"
                        class="w-full py-2.5 bg-orange-500 text-white text-sm font-medium rounded-lg transition flex items-center justify-center gap-2">
                    <div v-if="passwordLoading" class="w-4 h-4 border-2 border-white/30 border-t-white rounded-full animate-spin"></div>
                    {{ passwordLoading ? 'Memverifikasi...' : 'Buka Thread' }}
                </button>
                <p v-if="passwordError" class="text-red-500 text-xs mt-2">{{ passwordError }}</p>
            </div>
        </div>

        <!-- Login Required -->
        <div v-else-if="loginRequired" class="bg-white rounded-2xl p-8 text-center shadow-sm border border-stone-200">
            <div class="w-16 h-16 bg-blue-100 rounded-2xl flex items-center justify-center mx-auto mb-4">
                <svg class="w-8 h-8 text-blue-600" fill="none" stroke="currentColor" stroke-width="1.5" viewBox="0 0 24 24">
                    <path stroke-linecap="round" stroke-linejoin="round" d="M15.75 6a3.75 3.75 0 11-7.5 0 3.75 3.75 0 017.5 0zM4.501 20.118a7.5 7.5 0 0114.998 0"/>
                </svg>
            </div>
            <h2 class="text-lg font-bold text-stone-900 mb-1">Login Diperlukan</h2>
            <p class="text-sm text-stone-500 mb-6">Thread ini hanya dapat dilihat oleh pengguna yang sudah login.</p>
            <a href="/login" class="inline-block px-6 py-2.5 bg-orange-500 hover:bg-orange-600 text-white text-sm font-medium rounded-lg transition">
                Masuk
            </a>
        </div>

        <!-- Thread Content -->
        <template v-else-if="thread">
            <!-- Thread Card -->
            <div class="bg-white rounded-2xl border border-stone-200 overflow-hidden shadow-sm">
                <div class="p-5 sm:p-6">
                    <!-- Meta -->
                    <div class="flex items-center gap-2 mb-3 flex-wrap">
                        <span v-if="thread.tag_name"
                              class="inline-flex items-center px-2 py-0.5 rounded text-[11px] font-semibold text-white"
                              :style="'background-color:' + (thread.tag_color || '#f97316')">
                            {{ thread.tag_name }}
                        </span>
                        <span class="inline-flex items-center gap-1 px-2 py-0.5 rounded text-[11px] font-medium"
                              :class="{
                                  'bg-green-100 text-green-700': thread.access_type === 'public',
                                  'bg-blue-100 text-blue-700': thread.access_type === 'user',
                                  'bg-amber-100 text-amber-700': thread.access_type === 'password',
                              }">
                            <svg v-if="thread.access_type === 'public'" class="w-3 h-3" fill="none" stroke="currentColor" stroke-width="2" viewBox="0 0 24 24"><path stroke-linecap="round" stroke-linejoin="round" d="M13.5 10.5V6.75a4.5 4.5 0 119 0v3.75M3.75 21.75h10.5a2.25 2.25 0 002.25-2.25v-6.75a2.25 2.25 0 00-2.25-2.25H3.75a2.25 2.25 0 00-2.25 2.25v6.75a2.25 2.25 0 002.25 2.25z"/></svg>
                            <svg v-else-if="thread.access_type === 'user'" class="w-3 h-3" fill="none" stroke="currentColor" stroke-width="2" viewBox="0 0 24 24"><path stroke-linecap="round" stroke-linejoin="round" d="M15.75 6a3.75 3.75 0 11-7.5 0 3.75 3.75 0 017.5 0zM4.501 20.118a7.5 7.5 0 0114.998 0"/></svg>
                            <svg v-else class="w-3 h-3" fill="none" stroke="currentColor" stroke-width="2" viewBox="0 0 24 24"><path stroke-linecap="round" stroke-linejoin="round" d="M16.5 10.5V6.75a4.5 4.5 0 10-9 0v3.75m-.75 11.25h10.5a2.25 2.25 0 002.25-2.25v-6.75a2.25 2.25 0 00-2.25-2.25H6.75a2.25 2.25 0 00-2.25 2.25v6.75a2.25 2.25 0 002.25 2.25z"/></svg>
                            {{ thread.access_type === 'public' ? 'Publik' : thread.access_type === 'user' ? 'User' : 'Password' }}
                        </span>
                    </div>
                    <!-- Title -->
                    <h2 class="text-xl sm:text-2xl font-bold text-stone-900 mb-3 leading-snug">{{ thread.title }}</h2>
                    <!-- Author -->
                    <div class="flex items-center gap-3 mb-5">
                        <div class="w-8 h-8 rounded-full bg-orange-100 text-orange-600 flex items-center justify-center text-sm font-bold">
                            {{ (thread.author_name || 'A').charAt(0).toUpperCase() }}
                        </div>
                        <div>
                            <p class="text-sm font-medium text-stone-800">{{ thread.author_name || 'Anonim' }}</p>
                            <p class="text-xs text-stone-400">{{ timeAgo(thread.created_at) }}</p>
                        </div>
                    </div>
                    <!-- Content -->
                    <div class="text-sm text-stone-700 leading-relaxed whitespace-pre-wrap">{{ thread.content }}</div>
                </div>
                <!-- Delete Thread (hanya pemilik) -->
                <div v-if="isOwner" class="border-t border-stone-100 px-5 py-3 flex justify-end">
                    <button @click="deleteThread()" :disabled="deletingThread"
                            class="text-xs text-red-500 hover:text-red-700 transition flex items-center gap-1 disabled:opacity-50">
                        <svg class="w-3.5 h-3.5" fill="none" stroke="currentColor" stroke-width="2" viewBox="0 0 24 24"><path stroke-linecap="round" stroke-linejoin="round" d="M14.74 9l-.346 9m-4.788 0L9.26 9m9.968-3.21c.342.052.682.107 1.022.166m-1.022-.165L18.16 19.673a2.25 2.25 0 01-2.244 2.077H8.084a2.25 2.25 0 01-2.244-2.077L4.772 5.79m14.456 0a48.108 48.108 0 00-3.478-.397m-12 .562c.34-.059.68-.114 1.022-.165m0 0a48.11 48.11 0 013.478-.397m7.5 0v-.916c0-1.18-.91-2.164-2.09-2.201a51.964 51.964 0 00-3.32 0c-1.18.037-2.09 1.022-2.09 2.201v.916m7.5 0a48.667 48.667 0 00-7.5 0"/></svg>
                        Hapus Thread
                    </button>
                </div>
            </div>

            <!-- Replies Section -->
            <div class="mt-8">
                <div class="flex items-center justify-between mb-4">
                    <h3 class="text-sm font-bold text-stone-900">
                        Balasan
                        <span class="ml-1 text-stone-400 font-normal">({{ replies.length }})</span>
                    </h3>
                </div>

                <!-- Reply List -->
                <div v-if="replies.length > 0" class="space-y-3">
                    <div v-for="r in replies" :key="r.id"
                         class="bg-white border border-stone-200 rounded-xl p-4 group relative">
                        <div class="flex items-start gap-3">
                            <div class="w-7 h-7 rounded-full bg-stone-100 text-stone-500 flex items-center justify-center text-xs font-bold shrink-0 mt-0.5">
                                {{ (r.author_name || 'A').charAt(0).toUpperCase() }}
                            </div>
                            <div class="flex-1 min-w-0">
                                <div class="flex items-center gap-2 mb-1">
                                    <span class="text-sm font-medium text-stone-800">{{ r.author_name || 'Anonim' }}</span>
                                    <span class="text-xs text-stone-400">{{ timeAgo(r.created_at) }}</span>
                                </div>
                                <p class="text-sm text-stone-600 leading-relaxed whitespace-pre-wrap">{{ r.content }}</p>
                            </div>
                        </div>
                        <!-- Delete Reply (hanya pemilik) -->
                        <button v-if="r.author_id === currentUserId"
                                @click="deleteReply(r.id)"
                                :disabled="deletingReply === r.id"
                                class="absolute top-3 right-3 opacity-0 group-hover:opacity-100 text-stone-400 hover:text-red-500 transition p-1 disabled:opacity-50">
                            <svg class="w-4 h-4" fill="none" stroke="currentColor" stroke-width="2" viewBox="0 0 24 24"><path stroke-linecap="round" stroke-linejoin="round" d="M6 18L18 6M6 6l12 12"/></svg>
                        </button>
                    </div>
                </div>

                <!-- No Replies -->
                <div v-else class="bg-white rounded-xl border border-stone-200 p-8 text-center">
                    <p class="text-sm text-stone-400">Belum ada balasan</p>
                </div>

                <!-- Reply Form -->
                <div class="mt-4 bg-white rounded-xl border border-stone-200 p-4">
                    <textarea v-model="replyContent" rows="3" placeholder="Tulis balasan..."
                              class="w-full px-3.5 py-2.5 border border-stone-200 rounded-lg text-sm focus:outline-none focus:ring-2 focus:ring-orange-500/30 focus:border-orange-400 resize-none mb-3"></textarea>
                    <div class="flex justify-end">
                        <button @click="submitReply()" :disabled="submittingReply || !replyContent.trim()"
                                :class="(submittingReply || !replyContent.trim()) ? 'opacity-50 cursor-not-allowed' : 'hover:bg-orange-600'"
                                class="px-5 py-2 bg-orange-500 text-white text-sm font-medium rounded-lg transition flex items-center gap-2">
                            <div v-if="submittingReply" class="w-4 h-4 border-2 border-white/30 border-t-white rounded-full animate-spin"></div>
                            {{ submittingReply ? 'Mengirim...' : 'Kirim Balasan' }}
                        </button>
                    </div>
                </div>
            </div>
        </template>

        <!-- Not Found -->
        <div v-else-if="!loading" class="bg-white rounded-2xl p-8 text-center shadow-sm border border-stone-200">
            <svg class="w-16 h-16 text-stone-300 mx-auto mb-4" fill="none" stroke="currentColor" stroke-width="1" viewBox="0 0 24 24">
                <path stroke-linecap="round" stroke-linejoin="round" d="M12 9v3.75m9-.75a9 9 0 11-18 0 9 9 0 0118 0zm-9 3.75h.008v.008H12v-.008z"/>
            </svg>
            <h2 class="text-lg font-bold text-stone-900 mb-1">Thread Tidak Ditemukan</h2>
            <a href="/forum" class="text-sm text-orange-500 hover:text-orange-600 transition">Kembali ke Forum</a>
        </div>
    </main>

    <script>
    PetiteVue.createApp({
        threadId: parseInt(window.location.pathname.split('/').pop()) || 0,
        thread: null,
        replies: [],
        loading: true,
        passwordRequired: false,
        passwordTitle: '',
        passwordInput: '',
        passwordLoading: false,
        passwordError: '',
        loginRequired: false,
        replyContent: '',
        submittingReply: false,
        deletingThread: false,
        deletingReply: null,
        currentUserId: null,
        toast: { show: false, message: '', type: 'success' },

        get isOwner() {
            return this.currentUserId && this.thread && this.thread.author_id === this.currentUserId;
        },

        async mounted() {
            await this.checkAuth();
            await this.fetchThread();
        },

        async checkAuth() {
            try {
                const res = await fetch('/api/me');
                if (res.ok) {
                    const json = await res.json();
                    if (json.success && json.data) {
                        this.currentUserId = json.data.id;
                    }
                }
            } catch (e) { /* not logged in */ }
        },

        async fetchThread() {
            this.loading = true;
            this.passwordRequired = false;
            this.loginRequired = false;
            try {
                const res = await fetch('/forum/api/threads/' + this.threadId);
                const json = await res.json();
                if (json.success) {
                    this.thread = json.data.thread;
                    this.replies = json.data.replies || [];
                } else if (json.message === 'password_required') {
                    this.passwordRequired = true;
                    this.passwordTitle = json.data?.title || 'Thread Terproteksi';
                } else if (json.message === 'login_required') {
                    this.loginRequired = true;
                }
            } catch (e) {
                this.showToast('Gagal memuat thread', 'error');
            }
            this.loading = false;
        },

        async submitPassword() {
            if (!this.passwordInput.trim()) return;
            this.passwordLoading = true;
            this.passwordError = '';
            try {
                const res = await fetch('/forum/api/threads/' + this.threadId + '/verify-password', {
                    method: 'POST',
                    headers: { 'Content-Type': 'application/json' },
                    body: JSON.stringify({ password: this.passwordInput }),
                });
                const json = await res.json();
                if (json.success) {
                    this.passwordRequired = false;
                    await this.fetchThread();
                } else {
                    this.passwordError = json.message || 'Password salah';
                }
            } catch (e) {
                this.passwordError = 'Gagal memverifikasi password';
            }
            this.passwordLoading = false;
        },

        async submitReply() {
            if (!this.replyContent.trim()) return;
            this.submittingReply = true;
            try {
                const res = await fetch('/forum/api/threads/' + this.threadId + '/replies', {
                    method: 'POST',
                    headers: { 'Content-Type': 'application/json' },
                    body: JSON.stringify({ content: this.replyContent.trim() }),
                });
                const json = await res.json();
                if (json.success) {
                    this.replyContent = '';
                    this.showToast('Balasan berhasil dikirim');
                    await this.fetchThread();
                    this.$nextTick(() => {
                        const el = document.getElementById('reply-list-end');
                        if (el) el.scrollIntoView({ behavior: 'smooth' });
                    });
                } else {
                    this.showToast(json.message, 'error');
                }
            } catch (e) {
                this.showToast('Gagal mengirim balasan', 'error');
            }
            this.submittingReply = false;
        },

        async deleteThread() {
            if (!confirm('Hapus thread ini? Semua balasan juga akan dihapus.')) return;
            this.deletingThread = true;
            try {
                const res = await fetch('/forum/api/threads/' + this.threadId, { method: 'DELETE' });
                const json = await res.json();
                if (json.success) {
                    this.showToast('Thread berhasil dihapus');
                    window.location.href = '/forum';
                } else {
                    this.showToast(json.message, 'error');
                }
            } catch (e) {
                this.showToast('Gagal menghapus thread', 'error');
            }
            this.deletingThread = false;
        },

        async deleteReply(replyId) {
            if (!confirm('Hapus balasan ini?')) return;
            this.deletingReply = replyId;
            try {
                const res = await fetch('/forum/api/replies/' + replyId, { method: 'DELETE' });
                const json = await res.json();
                if (json.success) {
                    this.showToast('Balasan berhasil dihapus');
                    await this.fetchThread();
                } else {
                    this.showToast(json.message, 'error');
                }
            } catch (e) {
                this.showToast('Gagal menghapus balasan', 'error');
            }
            this.deletingReply = null;
        },

        timeAgo(dateStr) {
            const now = new Date();
            const date = new Date(dateStr);
            const s = Math.floor((now - date) / 1000);
            if (s < 60) return 'baru saja';
            const m = Math.floor(s / 60);
            if (m < 60) return m + ' menit lalu';
            const h = Math.floor(m / 60);
            if (h < 24) return h + ' jam lalu';
            const d = Math.floor(h / 24);
            if (d < 30) return d + ' hari lalu';
            const mo = Math.floor(d / 30);
            if (mo < 12) return mo + ' bulan lalu';
            return Math.floor(mo / 12) + ' tahun lalu';
        },

        showToast(message, type = 'success') {
            this.toast = { show: true, message, type };
            setTimeout(() => { this.toast.show = false; }, 3000);
        },
    }).mount('[v-scope]');
    </script>
</body>
</html>
