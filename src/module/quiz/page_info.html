<!DOCTYPE html>
<html lang="id">
<head>
<meta charset="UTF-8"/>
<meta name="viewport" content="width=device-width, initial-scale=1.0"/>
<title>Info Quiz</title>
<script src="https://cdn.tailwindcss.com"></script>
<script src="https://unpkg.com/petite-vue@0.4.1/dist/petite-vue.iife.js"></script>
<link rel="preconnect" href="https://fonts.googleapis.com"/>
<link href="https://fonts.googleapis.com/css2?family=Inter:wght@400;500;600;700&display=swap" rel="stylesheet"/>
<script>
  tailwind.config = {
    theme: {
      extend: {
        colors: {
          brand: {
            50:  '#eff6ff', 100: '#dbeafe', 200: '#bfdbfe',
            300: '#93c5fd', 400: '#60a5fa', 500: '#3b82f6',
            600: '#2563eb', 700: '#1d4ed8', 800: '#1e40af', 900: '#1e3a8a',
          }
        },
        fontFamily: { sans: ['Inter', 'sans-serif'] }
      }
    }
  }
</script>
<style>
  [v-cloak] { display: none; }
</style>
</head>
<body class="bg-slate-50 min-h-screen font-sans">

<div v-scope>

<!-- Navbar -->
<nav class="bg-white border-b border-slate-200 sticky top-0 z-30">
  <div class="max-w-4xl mx-auto px-4 h-14 flex items-center gap-3">
    <a href="/quiz" class="text-slate-500 hover:text-brand-600 transition-colors">
      <svg class="w-5 h-5" fill="none" stroke="currentColor" stroke-width="2" viewBox="0 0 24 24">
        <path stroke-linecap="round" stroke-linejoin="round" d="M10.5 19.5L3 12m0 0l7.5-7.5M3 12h18"/>
      </svg>
    </a>
    <span class="font-semibold text-brand-700">Detail Quiz</span>
  </div>
</nav>

<!-- Main -->
<main class="max-w-4xl mx-auto px-4 py-8" v-cloak>

  <!-- Loading -->
  <div v-if="loading" class="flex justify-center py-20">
    <div class="w-8 h-8 border-4 border-brand-200 border-t-brand-600 rounded-full animate-spin"></div>
  </div>

  <!-- Error -->
  <div v-else-if="error" class="text-center py-20">
    <p class="text-slate-700 font-medium">{{ error }}</p>
    <a href="/quiz" class="mt-4 inline-block text-brand-600 text-sm hover:underline">← Kembali ke daftar</a>
  </div>

  <template v-else-if="quiz">
    <!-- Hero card -->
    <div class="bg-gradient-to-br from-brand-600 to-brand-900 rounded-2xl text-white p-6 sm:p-8 mb-6">
      <div class="flex items-start justify-between gap-4">
        <div class="flex-1">
          <h1 class="text-2xl sm:text-3xl font-bold leading-tight mb-2">{{ quiz.title }}</h1>
          <p v-if="quiz.description" class="text-brand-200 text-sm sm:text-base mb-4">{{ quiz.description }}</p>
          <div class="flex flex-wrap gap-4 text-sm text-brand-100">
            <span class="flex items-center gap-1.5">
              <svg class="w-4 h-4" fill="none" stroke="currentColor" stroke-width="2" viewBox="0 0 24 24"><path stroke-linecap="round" d="M8.25 6.75h7.5M8.25 12h4.5"/><rect x="3" y="3" width="18" height="18" rx="3"/></svg>
              {{ quiz.question_count }} soal
            </span>
            <span class="flex items-center gap-1.5">
              <svg class="w-4 h-4" fill="none" stroke="currentColor" stroke-width="2" viewBox="0 0 24 24"><path stroke-linecap="round" d="M15.75 6a3.75 3.75 0 11-7.5 0 3.75 3.75 0 017.5 0zM4.501 20.118a7.5 7.5 0 0114.998 0"/></svg>
              {{ quiz.attempt_count }} peserta
            </span>
            <span class="flex items-center gap-1.5">
              <svg class="w-4 h-4" fill="none" stroke="currentColor" stroke-width="2" viewBox="0 0 24 24"><path stroke-linecap="round" d="M15.75 6a3.75 3.75 0 11-7.5 0 3.75 3.75 0 017.5 0zM4.501 20.118a7.5 7.5 0 0114.998 0"/></svg>
              Dibuat oleh {{ quiz.creator_name }}
            </span>
          </div>
        </div>
        <!-- Avatar inisial pembuat -->
        <div class="w-14 h-14 rounded-2xl bg-white/20 flex items-center justify-center text-2xl font-bold shrink-0">
          {{ quiz.creator_name.charAt(0).toUpperCase() }}
        </div>
      </div>

      <!-- CTA -->
      <div class="mt-6">
        <a :href="`/quiz/${quizId}/take`"
          class="inline-flex items-center gap-2 px-6 py-3 bg-white text-brand-700 font-semibold rounded-xl hover:bg-brand-50 transition-colors shadow">
          <svg class="w-4 h-4" fill="none" stroke="currentColor" stroke-width="2.5" viewBox="0 0 24 24">
            <path stroke-linecap="round" stroke-linejoin="round" d="M5.25 5.653c0-.856.917-1.398 1.667-.986l11.54 6.348a1.125 1.125 0 010 1.971l-11.54 6.347a1.125 1.125 0 01-1.667-.985V5.653z"/>
          </svg>
          Mulai Kerjakan
        </a>
      </div>
    </div>

    <!-- Leaderboard -->
    <div class="bg-white rounded-2xl border border-slate-200 overflow-hidden">
      <div class="px-5 py-4 border-b border-slate-100 flex items-center justify-between">
        <h2 class="font-semibold text-slate-800">Papan Peringkat</h2>
        <button @click="loadLeaderboard()" class="text-xs text-brand-600 hover:underline">Perbarui</button>
      </div>

      <!-- Loading lb -->
      <div v-if="lbLoading" class="flex justify-center py-10">
        <div class="w-6 h-6 border-4 border-brand-200 border-t-brand-600 rounded-full animate-spin"></div>
      </div>

      <!-- Empty lb -->
      <div v-else-if="leaderboard.length === 0" class="text-center py-12 text-slate-400">
        <svg class="w-12 h-12 mx-auto mb-3 opacity-30" fill="none" stroke="currentColor" stroke-width="1.5" viewBox="0 0 24 24">
          <path stroke-linecap="round" d="M16.5 18.75h-9m9 0a3 3 0 013 3h-15a3 3 0 013-3m9 0v-3.375c0-.621-.503-1.125-1.125-1.125h-.871M7.5 18.75v-3.375c0-.621.504-1.125 1.125-1.125h.872m5.007 0H9.497m5.007 0a7.454 7.454 0 01-.982-3.172M9.497 14.25a7.454 7.454 0 00.981-3.172M5.25 4.236c-.982.143-1.954.317-2.916.52A6.003 6.003 0 007.73 9.728M5.25 4.236V4.5c0 2.108.966 3.99 2.48 5.228M5.25 4.236V2.721C7.456 2.41 9.71 2.25 12 2.25c2.291 0 4.545.16 6.75.47v1.516M7.73 9.728a6.726 6.726 0 002.748 1.35m8.272-6.842V4.5c0 2.108-.966 3.99-2.48 5.228m2.48-5.492a46.32 46.32 0 012.916.52 6.003 6.003 0 01-5.395 4.972m0 0a6.726 6.726 0 01-2.749 1.35m0 0a6.772 6.772 0 01-3.044 0"/>
        </svg>
        <p class="text-sm font-medium">Belum ada yang mengerjakan</p>
        <p class="text-xs mt-1">Jadilah yang pertama!</p>
      </div>

      <!-- Table -->
      <div v-else class="divide-y divide-slate-100">
        <div v-for="(row, i) in leaderboard" :key="row.user_id"
          class="flex items-center gap-3 px-5 py-3.5"
          :class="i === 0 ? 'bg-amber-50' : i === 1 ? 'bg-slate-50' : ''">

          <!-- Rank badge -->
          <div class="w-8 h-8 rounded-full flex items-center justify-center text-xs font-bold shrink-0"
            :class="i === 0 ? 'bg-amber-400 text-white' : i === 1 ? 'bg-slate-400 text-white' : i === 2 ? 'bg-orange-400 text-white' : 'bg-slate-200 text-slate-600'">
            {{ row.rank }}
          </div>

          <!-- Avatar -->
          <div class="w-8 h-8 rounded-full bg-brand-100 flex items-center justify-center text-brand-700 text-sm font-semibold shrink-0">
            {{ row.fullname.charAt(0).toUpperCase() }}
          </div>

          <!-- Info -->
          <div class="flex-1 min-w-0">
            <p class="text-sm font-medium text-slate-800 truncate">{{ row.fullname }}</p>
            <p class="text-xs text-slate-400">@{{ row.username }}</p>
          </div>

          <!-- Skor -->
          <div class="text-right">
            <span class="text-base font-bold" :class="i === 0 ? 'text-amber-600' : 'text-brand-600'">
              {{ row.score.toFixed(1) }}
            </span>
            <span class="text-xs text-slate-400 ml-0.5">pts</span>
          </div>
        </div>
      </div>
    </div>
  </template>

</main>

</div>

<script>
  const quizInfoApp = {
    quiz: null,
    leaderboard: [],
    loading: true,
    lbLoading: false,
    error: null,

    get quizId() {
      return window.location.pathname.split('/').filter(Boolean)[1]
    },

    async loadQuiz() {
      try {
        const res = await fetch(`/quiz/api/${this.quizId}/info`)
        const json = await res.json()
        if (json.success) {
          this.quiz = json.data
        } else {
          this.error = json.message || 'Quiz tidak ditemukan'
        }
      } catch (e) {
        this.error = 'Gagal terhubung ke server'
      } finally {
        this.loading = false
      }
    },

    async loadLeaderboard() {
      this.lbLoading = true
      try {
        const res = await fetch(`/quiz/${this.quizId}/leaderboard`)
        const json = await res.json()
        if (json.success) this.leaderboard = json.data || []
      } catch (e) {
        // silent
      } finally {
        this.lbLoading = false
      }
    },

    mounted() {
      this.loadQuiz().then(() => {
        if (this.quiz) this.loadLeaderboard()
      })
    }
  };

  PetiteVue.createApp(quizInfoApp).mount();

  // Panggil dari object asli — pola yang sama dengan contoh forum
  quizInfoApp.loadQuiz().then(() => {
    if (quizInfoApp.quiz) quizInfoApp.loadLeaderboard()
  });
</script>
</body>
</html>
