
<!DOCTYPE html>
<html lang="id">
<head>
<meta charset="UTF-8" />
<meta name="viewport" content="width=device-width, initial-scale=1.0" />
<title>Masuk</title>
<script src="https://cdn.tailwindcss.com"></script>
<script src="https://unpkg.com/petite-vue@0.4.1/dist/petite-vue.iife.js"></script>
</head>
<body class="min-h-screen bg-zinc-950 text-zinc-100 flex items-center justify-center px-4">

<div id="app" v-scope class="w-full max-w-sm">

  <!-- Logo -->
  <div class="mb-10 text-center">
    <div class="inline-flex items-center justify-center w-12 h-12 rounded-xl bg-amber-400 mb-5">
      <svg class="w-7 h-7 text-zinc-950" fill="none" viewBox="0 0 24 24" stroke-width="2" stroke="currentColor">
        <path stroke-linecap="round" stroke-linejoin="round" d="M20.25 6.375c0 2.278-3.694 4.125-8.25 4.125S3.75 8.653 3.75 6.375m16.5 0c0-2.278-3.694-4.125-8.25-4.125S3.75 4.097 3.75 6.375m16.5 0v11.25c0 2.278-3.694 4.125-8.25 4.125s-8.25-1.847-8.25-4.125V6.375m16.5 2.625c0 2.278-3.694 4.125-8.25 4.125s-8.25-1.847-8.25-4.125m16.5 2.625v5.625c0 2.278-3.694 4.125-8.25 4.125s-8.25-1.847-8.25-4.125v-5.625" />
      </svg>
    </div>
    <p class="text-sm text-zinc-500 mt-1">Masuk untuk melanjutkan</p>
  </div>

  <!-- Alert -->
  <div
    v-if="alert"
    :class="alert.type === 'error'
      ? 'bg-red-500/10 text-red-400 border border-red-500/20'
      : 'bg-green-500/10 text-green-400 border border-green-500/20'"
    class="mb-5 px-4 py-3 rounded-lg text-sm font-medium"
  >{{ alert.msg }}</div>

  <!-- Form -->
  <div class="space-y-4">
    <div>
      <label for="username" class="block text-xs font-medium text-zinc-400 mb-1.5 uppercase tracking-widest">Username</label>
      <input
        id="username"
        type="text"
        v-model="username"
        autocomplete="username"
        placeholder="Masukkan username"
        @keydown.enter="submit"
        class="w-full bg-zinc-900 border border-zinc-800 rounded-lg px-4 py-2.5 text-sm text-zinc-100 placeholder-zinc-600 focus:outline-none focus:border-amber-400 focus:ring-1 focus:ring-amber-400 transition"
      />
    </div>

    <div>
      <label for="password" class="block text-xs font-medium text-zinc-400 mb-1.5 uppercase tracking-widest">Password</label>
      <div class="relative">
        <input
          id="password"
          :type="showPass ? 'text' : 'password'"
          v-model="password"
          autocomplete="current-password"
          placeholder="Masukkan password"
          @keydown.enter="submit"
          class="w-full bg-zinc-900 border border-zinc-800 rounded-lg px-4 py-2.5 pr-11 text-sm text-zinc-100 placeholder-zinc-600 focus:outline-none focus:border-amber-400 focus:ring-1 focus:ring-amber-400 transition"
        />
        <button
          type="button"
          @click="showPass = !showPass"
          class="absolute inset-y-0 right-0 flex items-center px-3 text-zinc-500 hover:text-zinc-300 transition"
          tabindex="-1"
          aria-label="Toggle visibilitas password"
        >
          <svg v-if="!showPass" class="w-4 h-4" fill="none" viewBox="0 0 24 24" stroke-width="1.8" stroke="currentColor">
            <path stroke-linecap="round" stroke-linejoin="round" d="M2.036 12.322a1.012 1.012 0 0 1 0-.639C3.423 7.51 7.36 4.5 12 4.5c4.638 0 8.573 3.007 9.963 7.178.07.207.07.431 0 .639C20.577 16.49 16.64 19.5 12 19.5c-4.638 0-8.573-3.007-9.963-7.178Z" />
            <path stroke-linecap="round" stroke-linejoin="round" d="M15 12a3 3 0 1 1-6 0 3 3 0 0 1 6 0Z" />
          </svg>
          <svg v-if="showPass" class="w-4 h-4" fill="none" viewBox="0 0 24 24" stroke-width="1.8" stroke="currentColor">
            <path stroke-linecap="round" stroke-linejoin="round" d="M3.98 8.223A10.477 10.477 0 0 0 1.934 12C3.226 16.338 7.244 19.5 12 19.5c.993 0 1.953-.138 2.863-.395M6.228 6.228A10.451 10.451 0 0 1 12 4.5c4.756 0 8.773 3.162 10.065 7.498a10.522 10.522 0 0 1-4.293 5.774M6.228 6.228 3 3m3.228 3.228 3.65 3.65m7.894 7.894L21 21m-3.228-3.228-3.65-3.65m0 0a3 3 0 1 0-4.243-4.243m4.242 4.242L9.88 9.88" />
          </svg>
        </button>
      </div>
    </div>

    <button
      @click="submit"
      :disabled="loading"
      class="w-full mt-2 bg-amber-400 hover:bg-amber-300 disabled:opacity-50 disabled:cursor-not-allowed text-zinc-950 font-semibold text-sm rounded-lg py-2.5 transition-colors duration-150 flex items-center justify-center gap-2"
    >
      <svg v-if="loading" class="w-4 h-4 animate-spin" fill="none" viewBox="0 0 24 24">
        <circle class="opacity-25" cx="12" cy="12" r="10" stroke="currentColor" stroke-width="4"></circle>
        <path class="opacity-75" fill="currentColor" d="M4 12a8 8 0 018-8V0C5.373 0 0 5.373 0 12h4z"></path>
      </svg>
      <span>{{ loading ? 'Memproses…' : 'Masuk' }}</span>
    </button>
  </div>

  <p class="mt-8 text-center text-xs text-zinc-600">
    Belum punya akun?
    <a href="/auth/register" class="text-amber-400 hover:text-amber-300 font-medium transition">Daftar</a>
  </p>

</div>

<script>
const ERROR_MAP = {
  blank_input: 'Username dan password wajib diisi.',
  user_not_found: 'Akun tidak ditemukan.',
  password_not_match: 'Password salah.',
  db_error: 'Terjadi kesalahan server.',
  session_error: 'Gagal memulai sesi.'
}

async function login(username, password) {
  const res = await fetch('/auth/api/login', {
    method: 'POST',
    headers: { 'Content-Type': 'application/json' },
    body: JSON.stringify({ username, password })
  })
  return res.json()
}

PetiteVue.createApp({
  username: '',
  password: '',
  showPass: false,
  loading: false,
  alert: null,

  showAlert(type, msg, duration = 4000) {
    this.alert = { type, msg }
    setTimeout(() => { this.alert = null }, duration)
  },

  async submit() {
    if (!this.username.trim() || !this.password) {
      this.showAlert('error', ERROR_MAP.blank_input)
      return
    }

    this.loading = true
    try {
      const json = await login(this.username.trim(), this.password)
      if (json.success) {
        this.showAlert('success', 'Login berhasil, mengalihkan…')
        setTimeout(() => { window.location.href = '/dashboard' }, 800)
      } else {
        this.showAlert('error', ERROR_MAP[json.message] ?? json.message)
      }
    } catch {
      this.showAlert('error', 'Tidak dapat terhubung ke server.')
    } finally {
      this.loading = false
    }
  }
}).mount('#app')
</script>

</body>
</html>
