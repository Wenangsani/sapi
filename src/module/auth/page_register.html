<!DOCTYPE html>
<html lang="id">
<head>
<meta charset="UTF-8" />
<meta name="viewport" content="width=device-width, initial-scale=1.0" />
<title>Daftar Akun Baru</title>
<script src="https://cdn.tailwindcss.com"></script>
<script src="https://unpkg.com/petite-vue@0.4.1/dist/petite-vue.iife.js"></script>
</head>
<body class="min-h-screen bg-gradient-to-br from-blue-50 to-indigo-100 text-slate-800 flex items-center justify-center px-4 py-8">

<div id="app" v-scope class="w-full max-w-md">
  
  <!-- Card Container -->
  <div class="bg-white/80 backdrop-blur-sm border border-white/50 shadow-xl rounded-2xl p-8 relative overflow-hidden">
    
    <!-- Top Accent Line -->
    <div class="absolute top-0 left-0 w-full h-2 bg-gradient-to-r from-blue-400 to-indigo-600"></div>

    <!-- Logo Section -->
    <div class="mb-8 text-center">
      <div class="inline-flex items-center justify-center w-16 h-16 rounded-full bg-blue-100 text-blue-600 mb-4 shadow-sm">
        <svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 24 24" fill="currentColor" class="w-8 h-8">
          <path fill-rule="evenodd" d="M18.685 19.097A9.723 9.723 0 0021.75 12c0-5.385-4.365-9.75-9.75-9.75S2.25 6.615 2.25 12a9.723 9.723 0 003.065 7.097A9.716 9.716 0 0012 21.75a9.716 9.716 0 006.685-2.653zm-12.54-1.285A7.486 7.486 0 0112 15a7.486 7.486 0 015.855 2.812A8.224 8.224 0 0112 20.25a8.224 8.224 0 01-5.855-2.438zM15.75 9a3.75 3.75 0 11-7.5 0 3.75 3.75 0 017.5 0z" clip-rule="evenodd" />
        </svg>
      </div>
      <h1 class="text-2xl font-bold text-slate-800">Buat Akun</h1>
      <p class="text-sm text-slate-500 mt-2">Silakan lengkapi data diri Anda untuk bergabung.</p>
    </div>

    <!-- Alert Box -->
    <div
      v-if="alert"
      :class="alert.type === 'error'
        ? 'bg-red-50 text-red-600 border-red-200'
        : 'bg-emerald-50 text-emerald-600 border-emerald-200'"
      class="mb-6 px-4 py-3 rounded-lg text-sm font-medium border flex items-center gap-2 animate-fade-in"
    >
      <span>{{ alert.msg }}</span>
    </div>

    <!-- Form -->
    <div class="space-y-5">

      <!-- Full Name (New) -->
      <div>
        <label for="fullname" class="block text-xs font-bold text-slate-500 mb-1.5 uppercase tracking-wider">Nama Lengkap</label>
        <input
          id="fullname"
          type="text"
          v-model="fullname"
          autocomplete="name"
          placeholder="Contoh: Budi Santoso"
          class="w-full bg-slate-50 border border-slate-200 rounded-lg px-4 py-3 text-sm text-slate-800 placeholder-slate-400 focus:outline-none focus:border-blue-500 focus:ring-2 focus:ring-blue-500/20 transition-all duration-200"
        />
      </div>

      <!-- Username -->
      <div>
        <label for="username" class="block text-xs font-bold text-slate-500 mb-1.5 uppercase tracking-wider">Username</label>
        <input
          id="username"
          type="text"
          v-model="username"
          autocomplete="username"
          placeholder="Pilih username unik"
          class="w-full bg-slate-50 border border-slate-200 rounded-lg px-4 py-3 text-sm text-slate-800 placeholder-slate-400 focus:outline-none focus:border-blue-500 focus:ring-2 focus:ring-blue-500/20 transition-all duration-200"
        />
      </div>

      <!-- Password -->
      <div>
        <label for="password" class="block text-xs font-bold text-slate-500 mb-1.5 uppercase tracking-wider">Password</label>
        <div class="relative group">
          <input
            id="password"
            :type="showPass ? 'text' : 'password'"
            v-model="password"
            autocomplete="new-password"
            placeholder="Buat password kuat"
            class="w-full bg-slate-50 border border-slate-200 rounded-lg px-4 py-3 text-sm text-slate-800 placeholder-slate-400 focus:outline-none focus:border-blue-500 focus:ring-2 focus:ring-blue-500/20 transition-all duration-200"
          />
          <button type="button" @click="showPass = !showPass" class="absolute inset-y-0 right-0 flex items-center px-3 text-slate-400 hover:text-blue-600 transition" tabindex="-1" aria-label="Toggle visibilitas password">
            <svg v-if="!showPass" class="w-5 h-5" fill="none" viewBox="0 0 24 24" stroke-width="1.5" stroke="currentColor">
              <path stroke-linecap="round" stroke-linejoin="round" d="M3.98 8.223A10.477 10.477 0 001.934 12C3.226 16.338 7.244 19.5 12 19.5c.993 0 1.953-.138 2.863-.395M6.228 6.228A10.45 10.45 0 0112 4.5c4.756 0 8.773 3.162 10.065 7.498a10.52 10.52 0 01-4.293 5.774M6.228 6.228 3 3m3.228 3.228 3.65 3.65m7.894 7.894L21 21m-3.228-3.228-3.65-3.65m0 0a3 3 0 10-4.243-4.243m4.242 4.242L9.88 9.88" />
            </svg>
            <svg v-if="showPass" class="w-5 h-5" fill="none" viewBox="0 0 24 24" stroke-width="1.5" stroke="currentColor">
              <path stroke-linecap="round" stroke-linejoin="round" d="M2.036 12.322a1.012 1.012 0 010-.639C3.423 7.51 7.36 4.5 12 4.5c4.638 0 8.573 3.007 9.963 7.178.07.207.07.431 0 .639C20.577 16.49 16.64 19.5 12 19.5c-4.638 0-8.573-3.007-9.963-7.178z" />
              <path stroke-linecap="round" stroke-linejoin="round" d="M15 12a3 3 0 11-6 0 3 3 0 016 0z" />
            </svg>
          </button>
        </div>
      </div>

      <!-- Konfirmasi Password -->
      <div>
        <label for="confirm_password" class="block text-xs font-bold text-slate-500 mb-1.5 uppercase tracking-wider">Konfirmasi Password</label>
        <div class="relative group">
          <input
            id="confirm_password"
            :type="showConfirm ? 'text' : 'password'"
            v-model="confirmPassword"
            autocomplete="new-password"
            placeholder="Ulangi password"
            :class="mismatch
              ? 'border-red-300 focus:border-red-500 focus:ring-red-500/20 text-red-600'
              : 'border-slate-200 focus:border-blue-500 focus:ring-blue-500/20'"
            class="w-full bg-slate-50 border rounded-lg px-4 py-3 text-sm text-slate-800 placeholder-slate-400 focus:outline-none focus:ring-2 transition-all duration-200"
          />
          <button type="button" @click="showConfirm = !showConfirm" class="absolute inset-y-0 right-0 flex items-center px-3 text-slate-400 hover:text-blue-600 transition" tabindex="-1" aria-label="Toggle visibilitas konfirmasi password">
            <svg v-if="!showConfirm" class="w-5 h-5" fill="none" viewBox="0 0 24 24" stroke-width="1.5" stroke="currentColor">
              <path stroke-linecap="round" stroke-linejoin="round" d="M3.98 8.223A10.477 10.477 0 001.934 12C3.226 16.338 7.244 19.5 12 19.5c.993 0 1.953-.138 2.863-.395M6.228 6.228A10.45 10.45 0 0112 4.5c4.756 0 8.773 3.162 10.065 7.498a10.52 10.52 0 01-4.293 5.774M6.228 6.228 3 3m3.228 3.228 3.65 3.65m7.894 7.894L21 21m-3.228-3.228-3.65-3.65m0 0a3 3 0 10-4.243-4.243m4.242 4.242L9.88 9.88" />
            </svg>
            <svg v-if="showConfirm" class="w-5 h-5" fill="none" viewBox="0 0 24 24" stroke-width="1.5" stroke="currentColor">
              <path stroke-linecap="round" stroke-linejoin="round" d="M2.036 12.322a1.012 1.012 0 010-.639C3.423 7.51 7.36 4.5 12 4.5c4.638 0 8.573 3.007 9.963 7.178.07.207.07.431 0 .639C20.577 16.49 16.64 19.5 12 19.5c-4.638 0-8.573-3.007-9.963-7.178z" />
              <path stroke-linecap="round" stroke-linejoin="round" d="M15 12a3 3 0 11-6 0 3 3 0 016 0z" />
            </svg>
          </button>
        </div>
        <p v-if="mismatch" class="mt-2 text-xs text-red-500 flex items-center gap-1">
          <svg class="w-3 h-3" fill="none" viewBox="0 0 24 24" stroke="currentColor" stroke-width="2"><path stroke-linecap="round" stroke-linejoin="round" d="M12 8v4m0 4h.01M21 12a9 9 0 11-18 0 9 9 0 0118 0z" /></svg>
          Password tidak cocok.
        </p>
      </div>

      <!-- Submit Button -->
      <button
        @click="submit"
        :disabled="loading || mismatch"
        class="w-full mt-4 bg-blue-600 hover:bg-blue-700 active:bg-blue-800 disabled:opacity-70 disabled:cursor-not-allowed text-white font-semibold text-sm rounded-lg py-3.5 transition-all duration-200 flex items-center justify-center gap-2 shadow-lg shadow-blue-500/30"
      >
        <svg v-if="loading" class="w-5 h-5 animate-spin" fill="none" viewBox="0 0 24 24">
          <circle class="opacity-25" cx="12" cy="12" r="10" stroke="currentColor" stroke-width="4"></circle>
          <path class="opacity-75" fill="currentColor" d="M4 12a8 8 0 018-8V0C5.373 0 0 5.373 0 12h4z"></path>
        </svg>
        <span>{{ loading ? 'Memproses…' : 'Buat Akun Sekarang' }}</span>
      </button>
    </div>

    <!-- Footer -->
    <div class="mt-8 text-center text-sm text-slate-500 border-t border-slate-100 pt-6">
      Sudah punya akun?
      <a href="/auth/login" class="text-blue-600 hover:text-blue-700 font-semibold transition hover:underline ml-1">Masuk disini</a>
    </div>

  </div>
</div>

<script>
const ERROR_MAP = {
  blank_input: 'Semua kolom wajib diisi.',
  username_already_used: 'Username sudah digunakan, coba yang lain.',
  hash_error: 'Terjadi kesalahan saat memproses password.',
  db_error: 'Terjadi kesalahan server.',
  session_error: 'Gagal memulai sesi.'
}

async function register(fullname, username, password) {
  // Catatan: Pastikan backend Anda menangani properti 'fullname' ini
  const res = await fetch('/auth/api/register', {
    method: 'POST',
    headers: { 'Content-Type': 'application/json' },
    body: JSON.stringify({ fullname, username, password })
  })
  return res.json()
}

PetiteVue.createApp({
  fullname: '',
  username: '',
  password: '',
  confirmPassword: '',
  showPass: false,
  showConfirm: false,
  loading: false,
  alert: null,

  get mismatch() {
    return this.confirmPassword.length > 0 && this.password !== this.confirmPassword
  },

  showAlert(type, msg, duration = 4000) {
    this.alert = { type, msg }
    setTimeout(() => { this.alert = null }, duration)
  },

  async submit() {
    // Validasi input kosong
    if (!this.fullname.trim() || !this.username.trim() || !this.password) {
      this.showAlert('error', ERROR_MAP.blank_input)
      return
    }
    if (this.mismatch) {
      this.showAlert('error', 'Konfirmasi password tidak cocok.')
      return
    }

    this.loading = true
    try {
      // Kirim fullname bersama data lainnya
      const json = await register(this.fullname.trim(), this.username.trim(), this.password)
      
      if (json.success) {
        this.showAlert('success', 'Akun berhasil dibuat, mengalihkan…')
        setTimeout(() => { window.location.href = '/dashboard' }, 1000)
      } else {
        this.showAlert('error', ERROR_MAP[json.message] ?? json.message)
      }
    } catch {
      this.showAlert('error', 'Tidak dapat terhubung ke server.')
    } finally {
      this.loading = false
    }
  }
}).mount('#app')
</script>

</body>
</html>
