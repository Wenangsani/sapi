<!DOCTYPE html>
<html lang="id">
<head>
<meta charset="UTF-8" />
<meta name="viewport" content="width=device-width, initial-scale=1.0" />
<title>Daftar Akun Baru</title>
<script src="https://cdn.tailwindcss.com"></script>
<script src="https://unpkg.com/petite-vue@0.4.1/dist/petite-vue.iife.js"></script>
</head>
<body class="min-h-screen bg-gradient-to-br from-blue-50 to-indigo-100 text-slate-800 flex items-center justify-center px-4 py-8">

<div id="app" class="w-full max-w-md">

  <!-- Card Container -->
  <div class="bg-white/80 backdrop-blur-sm border border-white/50 shadow-xl rounded-2xl p-8 relative overflow-hidden">

    <!-- Top Accent Line -->
    <div class="absolute top-0 left-0 w-full h-1.5 bg-gradient-to-r from-blue-400 to-indigo-600"></div>

    <!-- Logo Section -->
    <div class="mb-8 text-center">
      <div class="inline-flex items-center justify-center w-16 h-16 rounded-full bg-blue-100 text-blue-600 mb-4 shadow-sm">
        <!-- Heroicon: user-plus -->
        <svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 24 24" fill="currentColor" class="w-8 h-8">
          <path d="M6.25 6.375a4.125 4.125 0 1 1 8.25 0 4.125 4.125 0 0 1-8.25 0ZM3.25 19.125a7.125 7.125 0 0 1 14.25 0v.003l-.001.119a.75.75 0 0 1-.363.63 13.067 13.067 0 0 1-6.761 1.873c-2.472 0-4.786-.684-6.76-1.873a.75.75 0 0 1-.364-.63l-.001-.122ZM19.75 7.5a.75.75 0 0 0-1.5 0v2.25H16a.75.75 0 0 0 0 1.5h2.25v2.25a.75.75 0 0 0 1.5 0v-2.25H22a.75.75 0 0 0 0-1.5h-2.25V7.5Z" />
        </svg>
      </div>
      <h1 class="text-2xl font-bold text-slate-800">Buat Akun</h1>
      <p class="text-sm text-slate-500 mt-1.5">Lengkapi data diri Anda untuk bergabung.</p>
    </div>

    <!-- Alert Box -->
    <div
      v-if="alert"
      :class="alert.type === 'error'
        ? 'bg-red-50 text-red-600 border-red-200'
        : 'bg-emerald-50 text-emerald-600 border-emerald-200'"
      class="mb-5 px-4 py-3 rounded-lg text-sm font-medium border flex items-start gap-2"
    >
      <!-- Heroicon: exclamation-circle -->
      <svg v-if="alert.type === 'error'" xmlns="http://www.w3.org/2000/svg" viewBox="0 0 20 20" fill="currentColor" class="w-4 h-4 shrink-0 mt-0.5">
        <path fill-rule="evenodd" d="M18 10a8 8 0 1 1-16 0 8 8 0 0 1 16 0Zm-8-5a.75.75 0 0 1 .75.75v4.5a.75.75 0 0 1-1.5 0v-4.5A.75.75 0 0 1 10 5Zm0 10a1 1 0 1 0 0-2 1 1 0 0 0 0 2Z" clip-rule="evenodd" />
      </svg>
      <!-- Heroicon: check-circle -->
      <svg v-if="alert.type === 'success'" xmlns="http://www.w3.org/2000/svg" viewBox="0 0 20 20" fill="currentColor" class="w-4 h-4 shrink-0 mt-0.5">
        <path fill-rule="evenodd" d="M10 18a8 8 0 1 0 0-16 8 8 0 0 0 0 16Zm3.857-9.809a.75.75 0 0 0-1.214-.882l-3.483 4.79-1.88-1.88a.75.75 0 1 0-1.06 1.061l2.5 2.5a.75.75 0 0 0 1.137-.089l4-5.5Z" clip-rule="evenodd" />
      </svg>
      <span>{{ alert.msg }}</span>
    </div>

    <!-- Form -->
    <div class="space-y-5">

      <!-- Nama Lengkap -->
      <div>
        <label for="fullname" class="block text-xs font-bold text-slate-500 mb-1.5 uppercase tracking-wider">Nama Lengkap</label>
        <input
          id="fullname"
          type="text"
          v-model="fullname"
          autocomplete="name"
          placeholder="Contoh: Budi Santoso"
          class="w-full bg-slate-50 border border-slate-200 rounded-lg px-4 py-3 text-sm text-slate-800 placeholder-slate-400 focus:outline-none focus:border-blue-500 focus:ring-2 focus:ring-blue-500/20 transition-all duration-200"
        />
      </div>

      <!-- Username -->
      <div>
        <label for="username" class="block text-xs font-bold text-slate-500 mb-1.5 uppercase tracking-wider">Username</label>
        <input
          id="username"
          type="text"
          v-model="username"
          autocomplete="username"
          placeholder="Pilih username unik"
          class="w-full bg-slate-50 border border-slate-200 rounded-lg px-4 py-3 text-sm text-slate-800 placeholder-slate-400 focus:outline-none focus:border-blue-500 focus:ring-2 focus:ring-blue-500/20 transition-all duration-200"
        />
      </div>

      <!-- Password -->
      <div>
        <label for="password" class="block text-xs font-bold text-slate-500 mb-1.5 uppercase tracking-wider">Password</label>
        <div class="relative">
          <input
            id="password"
            :type="showPass ? 'text' : 'password'"
            v-model="password"
            autocomplete="new-password"
            placeholder="Buat password kuat"
            class="w-full bg-slate-50 border border-slate-200 rounded-lg px-4 py-3 pr-11 text-sm text-slate-800 placeholder-slate-400 focus:outline-none focus:border-blue-500 focus:ring-2 focus:ring-blue-500/20 transition-all duration-200"
          />
          <button
            type="button"
            @click="showPass = !showPass"
            class="absolute inset-y-0 right-0 flex items-center px-3 text-slate-400 hover:text-blue-600 transition-colors"
            tabindex="-1"
            aria-label="Toggle visibilitas password"
          >
            <!-- Heroicon: eye-slash -->
            <svg v-if="!showPass" xmlns="http://www.w3.org/2000/svg" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="1.5" stroke-linecap="round" stroke-linejoin="round" class="w-5 h-5">
              <path d="M3.98 8.223A10.477 10.477 0 0 0 1.934 12C3.226 16.338 7.244 19.5 12 19.5c.993 0 1.953-.138 2.863-.395M6.228 6.228A10.45 10.45 0 0 1 12 4.5c4.756 0 8.773 3.162 10.065 7.498a10.52 10.52 0 0 1-4.293 5.774M6.228 6.228 3 3m3.228 3.228 3.65 3.65m7.894 7.894L21 21m-3.228-3.228-3.65-3.65m0 0a3 3 0 1 0-4.243-4.243m4.242 4.242L9.88 9.88" />
            </svg>
            <!-- Heroicon: eye -->
            <svg v-if="showPass" xmlns="http://www.w3.org/2000/svg" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="1.5" stroke-linecap="round" stroke-linejoin="round" class="w-5 h-5">
              <path d="M2.036 12.322a1.012 1.012 0 0 1 0-.639C3.423 7.51 7.36 4.5 12 4.5c4.638 0 8.573 3.007 9.963 7.178.07.207.07.431 0 .639C20.577 16.49 16.64 19.5 12 19.5c-4.638 0-8.573-3.007-9.963-7.178Z" />
              <path d="M15 12a3 3 0 1 1-6 0 3 3 0 0 1 6 0Z" />
            </svg>
          </button>
        </div>
      </div>

      <!-- Konfirmasi Password -->
      <div>
        <label for="confirm_password" class="block text-xs font-bold text-slate-500 mb-1.5 uppercase tracking-wider">Konfirmasi Password</label>
        <div class="relative">
          <input
            id="confirm_password"
            :type="showConfirm ? 'text' : 'password'"
            v-model="confirmPassword"
            autocomplete="new-password"
            placeholder="Ulangi password"
            :class="mismatch
              ? 'border-red-300 focus:border-red-500 focus:ring-red-500/20'
              : 'border-slate-200 focus:border-blue-500 focus:ring-blue-500/20'"
            class="w-full bg-slate-50 border rounded-lg px-4 py-3 pr-11 text-sm text-slate-800 placeholder-slate-400 focus:outline-none focus:ring-2 transition-all duration-200"
          />
          <button
            type="button"
            @click="showConfirm = !showConfirm"
            class="absolute inset-y-0 right-0 flex items-center px-3 text-slate-400 hover:text-blue-600 transition-colors"
            tabindex="-1"
            aria-label="Toggle visibilitas konfirmasi password"
          >
            <!-- Heroicon: eye-slash -->
            <svg v-if="!showConfirm" xmlns="http://www.w3.org/2000/svg" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="1.5" stroke-linecap="round" stroke-linejoin="round" class="w-5 h-5">
              <path d="M3.98 8.223A10.477 10.477 0 0 0 1.934 12C3.226 16.338 7.244 19.5 12 19.5c.993 0 1.953-.138 2.863-.395M6.228 6.228A10.45 10.45 0 0 1 12 4.5c4.756 0 8.773 3.162 10.065 7.498a10.52 10.52 0 0 1-4.293 5.774M6.228 6.228 3 3m3.228 3.228 3.65 3.65m7.894 7.894L21 21m-3.228-3.228-3.65-3.65m0 0a3 3 0 1 0-4.243-4.243m4.242 4.242L9.88 9.88" />
            </svg>
            <!-- Heroicon: eye -->
            <svg v-if="showConfirm" xmlns="http://www.w3.org/2000/svg" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="1.5" stroke-linecap="round" stroke-linejoin="round" class="w-5 h-5">
              <path d="M2.036 12.322a1.012 1.012 0 0 1 0-.639C3.423 7.51 7.36 4.5 12 4.5c4.638 0 8.573 3.007 9.963 7.178.07.207.07.431 0 .639C20.577 16.49 16.64 19.5 12 19.5c-4.638 0-8.573-3.007-9.963-7.178Z" />
              <path d="M15 12a3 3 0 1 1-6 0 3 3 0 0 1 6 0Z" />
            </svg>
          </button>
        </div>
        <!-- Inline mismatch hint -->
        <p v-if="mismatch" class="mt-1.5 text-xs text-red-500 flex items-center gap-1">
          <!-- Heroicon: exclamation-circle (mini) -->
          <svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 16 16" fill="currentColor" class="w-3.5 h-3.5 shrink-0">
            <path fill-rule="evenodd" d="M8 15A7 7 0 1 0 8 1a7 7 0 0 0 0 14Zm0-10a.75.75 0 0 1 .75.75v3.5a.75.75 0 0 1-1.5 0v-3.5A.75.75 0 0 1 8 5Zm0 7a1 1 0 1 0 0-2 1 1 0 0 0 0 2Z" clip-rule="evenodd" />
          </svg>
          Password tidak cocok.
        </p>
      </div>

      <!-- Submit Button -->
      <button
        @click="submit"
        :disabled="loading || mismatch"
        class="w-full mt-2 bg-blue-600 hover:bg-blue-700 active:bg-blue-800 disabled:opacity-60 disabled:cursor-not-allowed text-white font-semibold text-sm rounded-lg py-3.5 transition-all duration-200 flex items-center justify-center gap-2 shadow-md shadow-blue-500/25"
      >
        <svg v-if="loading" class="w-4 h-4 animate-spin" fill="none" viewBox="0 0 24 24">
          <circle class="opacity-25" cx="12" cy="12" r="10" stroke="currentColor" stroke-width="4"></circle>
          <path class="opacity-75" fill="currentColor" d="M4 12a8 8 0 0 1 8-8V0C5.373 0 0 5.373 0 12h4z"></path>
        </svg>
        <span>{{ loading ? 'Memproses…' : 'Buat Akun Sekarang' }}</span>
      </button>
    </div>

    <!-- Footer -->
    <div class="mt-8 text-center text-sm text-slate-500 border-t border-slate-100 pt-6">
      Sudah punya akun?
      <a href="/auth/login" class="text-blue-600 hover:text-blue-700 font-semibold transition hover:underline ml-1">Masuk disini</a>
    </div>

  </div>
</div>

<script>
const ERROR_MAP = {
  blank_input: 'Semua kolom wajib diisi.',
  username_already_used: 'Username sudah digunakan, coba yang lain.',
  hash_error: 'Terjadi kesalahan saat memproses password.',
  db_error: 'Terjadi kesalahan server.',
  session_error: 'Gagal memulai sesi.',
}

const state = {
  fullname: '',
  username: '',
  password: '',
  confirmPassword: '',
  showPass: false,
  showConfirm: false,
  loading: false,
  alert: null,

  get mismatch() {
    return this.confirmPassword.length > 0 && this.password !== this.confirmPassword
  },

  showAlert(type, msg, duration = 4000) {
    this.alert = { type, msg }
    setTimeout(() => { this.alert = null }, duration)
  },

  async submit() {
    if (!this.fullname.trim() || !this.username.trim() || !this.password) {
      this.showAlert('error', ERROR_MAP.blank_input)
      return
    }
    if (this.mismatch) {
      this.showAlert('error', 'Konfirmasi password tidak cocok.')
      return
    }

    this.loading = true
    try {
      const res = await fetch('/auth/api/register', {
        method: 'POST',
        headers: { 'Content-Type': 'application/json' },
        body: JSON.stringify({
          fullname: this.fullname.trim(),
          username: this.username.trim(),
          password: this.password,
        }),
      })
      const json = await res.json()
      if (json.success) {
        this.showAlert('success', 'Akun berhasil dibuat, mengalihkan…', 2000)
        setTimeout(() => { window.location.href = '/dashboard' }, 1000)
      } else {
        this.showAlert('error', ERROR_MAP[json.message] ?? json.message)
      }
    } catch {
      this.showAlert('error', 'Tidak dapat terhubung ke server.')
    } finally {
      this.loading = false
    }
  },
}

PetiteVue.createApp(state).mount('#app')
</script>

</body>
</html>
