<!DOCTYPE html>
<html lang="id">
<head>
<meta charset="UTF-8" />
<meta name="viewport" content="width=device-width, initial-scale=1.0" />
<title>Masuk Akun</title>
<script src="https://cdn.tailwindcss.com"></script>
<script src="https://unpkg.com/petite-vue@0.4.1/dist/petite-vue.iife.js"></script>
</head>
<body class="min-h-screen bg-gradient-to-br from-blue-50 to-indigo-100 text-slate-800 flex items-center justify-center px-4 py-8">

<div id="app" v-scope class="w-full max-w-sm">

  <!-- Card Container -->
  <div class="bg-white/80 backdrop-blur-sm border border-white/50 shadow-xl rounded-2xl p-8 relative overflow-hidden">
    
    <!-- Top Accent Line -->
    <div class="absolute top-0 left-0 w-full h-2 bg-gradient-to-r from-blue-400 to-indigo-600"></div>

    <!-- Logo Section -->
    <div class="mb-8 text-center">
      <div class="inline-flex items-center justify-center w-16 h-16 rounded-full bg-blue-100 text-blue-600 mb-4 shadow-sm">
        <!-- Changed icon to a Login/User Icon -->
        <svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 24 24" fill="currentColor" class="w-8 h-8">
          <path fill-rule="evenodd" d="M7.5 3.75A1.5 1.5 0 006 5.25v13.5a1.5 1.5 0 001.5 1.5h6a1.5 1.5 0 001.5-1.5V15a.75.75 0 011.5 0v3.75a3 3 0 01-3 3h-6a3 3 0 01-3-3V5.25a3 3 0 013-3h6a3 3 0 013 3V9A.75.75 0 0115 9V5.25a1.5 1.5 0 00-1.5-1.5h-6z" clip-rule="evenodd" />
          <path d="M15.75 9a3 3 0 00-3-3H8.25a3 3 0 00-3 3v10.5a3 3 0 003 3h4.5a3 3 0 003-3V9z" opacity="0.2" /> <!-- Abstract decorative block -->
          <path fill-rule="evenodd" d="M15.28 8.22a.75.75 0 00-1.06 0l-2.97 2.97a.75.75 0 101.06 1.06l1.72-1.72v4.69a.75.75 0 001.5 0v-4.69l1.72 1.72a.75.75 0 101.06-1.06l-2.97-2.97a.75.75 0 00-1.06 0z" clip-rule="evenodd" />
        </svg>
      </div>
      <h1 class="text-2xl font-bold text-slate-800">Selamat Datang</h1>
      <p class="text-sm text-slate-500 mt-2">Masuk untuk melanjutkan ke dashboard</p>
    </div>

    <!-- Alert Box -->
    <div
      v-if="alert"
      :class="alert.type === 'error'
        ? 'bg-red-50 text-red-600 border-red-200'
        : 'bg-emerald-50 text-emerald-600 border-emerald-200'"
      class="mb-6 px-4 py-3 rounded-lg text-sm font-medium border flex items-center gap-2 animate-fade-in"
    >
      <span>{{ alert.msg }}</span>
    </div>

    <!-- Form -->
    <div class="space-y-5">
      
      <!-- Username -->
      <div>
        <label for="username" class="block text-xs font-bold text-slate-500 mb-1.5 uppercase tracking-wider">Username</label>
        <input
          id="username"
          type="text"
          v-model="username"
          autocomplete="username"
          placeholder="Masukkan username Anda"
          @keydown.enter="submit"
          class="w-full bg-slate-50 border border-slate-200 rounded-lg px-4 py-3 text-sm text-slate-800 placeholder-slate-400 focus:outline-none focus:border-blue-500 focus:ring-2 focus:ring-blue-500/20 transition-all duration-200"
        />
      </div>

      <!-- Password -->
      <div>
        <label for="password" class="block text-xs font-bold text-slate-500 mb-1.5 uppercase tracking-wider">Password</label>
        <div class="relative group">
          <input
            id="password"
            :type="showPass ? 'text' : 'password'"
            v-model="password"
            autocomplete="current-password"
            placeholder="Masukkan password"
            @keydown.enter="submit"
            class="w-full bg-slate-50 border border-slate-200 rounded-lg px-4 py-3 text-sm text-slate-800 placeholder-slate-400 focus:outline-none focus:border-blue-500 focus:ring-2 focus:ring-blue-500/20 transition-all duration-200"
          />
          <button
            type="button"
            @click="showPass = !showPass"
            class="absolute inset-y-0 right-0 flex items-center px-3 text-slate-400 hover:text-blue-600 transition"
            tabindex="-1"
            aria-label="Toggle visibilitas password"
          >
            <svg v-if="!showPass" class="w-5 h-5" fill="none" viewBox="0 0 24 24" stroke-width="1.5" stroke="currentColor">
              <path stroke-linecap="round" stroke-linejoin="round" d="M3.98 8.223A10.477 10.477 0 001.934 12C3.226 16.338 7.244 19.5 12 19.5c.993 0 1.953-.138 2.863-.395M6.228 6.228A10.45 10.45 0 0112 4.5c4.756 0 8.773 3.162 10.065 7.498a10.52 10.52 0 01-4.293 5.774M6.228 6.228 3 3m3.228 3.228 3.65 3.65m7.894 7.894L21 21m-3.228-3.228-3.65-3.65m0 0a3 3 0 10-4.243-4.243m4.242 4.242L9.88 9.88" />
            </svg>
            <svg v-if="showPass" class="w-5 h-5" fill="none" viewBox="0 0 24 24" stroke-width="1.5" stroke="currentColor">
              <path stroke-linecap="round" stroke-linejoin="round" d="M2.036 12.322a1.012 1.012 0 010-.639C3.423 7.51 7.36 4.5 12 4.5c4.638 0 8.573 3.007 9.963 7.178.07.207.07.431 0 .639C20.577 16.49 16.64 19.5 12 19.5c-4.638 0-8.573-3.007-9.963-7.178z" />
              <path stroke-linecap="round" stroke-linejoin="round" d="M15 12a3 3 0 11-6 0 3 3 0 016 0z" />
            </svg>
          </button>
        </div>
      </div>

      <!-- Submit Button -->
      <button
        @click="submit"
        :disabled="loading"
        class="w-full mt-4 bg-blue-600 hover:bg-blue-700 active:bg-blue-800 disabled:opacity-70 disabled:cursor-not-allowed text-white font-semibold text-sm rounded-lg py-3.5 transition-all duration-200 flex items-center justify-center gap-2 shadow-lg shadow-blue-500/30"
      >
        <svg v-if="loading" class="w-5 h-5 animate-spin" fill="none" viewBox="0 0 24 24">
          <circle class="opacity-25" cx="12" cy="12" r="10" stroke="currentColor" stroke-width="4"></circle>
          <path class="opacity-75" fill="currentColor" d="M4 12a8 8 0 018-8V0C5.373 0 0 5.373 0 12h4z"></path>
        </svg>
        <span>{{ loading ? 'Memproses…' : 'Masuk Sekarang' }}</span>
      </button>
    </div>

    <!-- Footer -->
    <div class="mt-8 text-center text-sm text-slate-500 border-t border-slate-100 pt-6">
      Belum punya akun?
      <a href="/auth/register" class="text-blue-600 hover:text-blue-700 font-semibold transition hover:underline ml-1">Daftar disini</a>
    </div>

  </div>
</div>

<script>
const ERROR_MAP = {
  blank_input: 'Username dan password wajib diisi.',
  user_not_found: 'Akun tidak ditemukan.',
  password_not_match: 'Password salah.',
  db_error: 'Terjadi kesalahan server.',
  session_error: 'Gagal memulai sesi.'
}

async function login(username, password) {
  const res = await fetch('/auth/api/login', {
    method: 'POST',
    headers: { 'Content-Type': 'application/json' },
    body: JSON.stringify({ username, password })
  })
  return res.json()
}

PetiteVue.createApp({
  username: '',
  password: '',
  showPass: false,
  loading: false,
  alert: null,

  showAlert(type, msg, duration = 4000) {
    this.alert = { type, msg }
    setTimeout(() => { this.alert = null }, duration)
  },

  async submit() {
    if (!this.username.trim() || !this.password) {
      this.showAlert('error', ERROR_MAP.blank_input)
      return
    }

    this.loading = true
    try {
      const json = await login(this.username.trim(), this.password)
      if (json.success) {
        this.showAlert('success', 'Login berhasil, mengalihkan…')
        setTimeout(() => { window.location.href = '/dashboard' }, 1000)
      } else {
        this.showAlert('error', ERROR_MAP[json.message] ?? json.message)
      }
    } catch {
      this.showAlert('error', 'Tidak dapat terhubung ke server.')
    } finally {
      this.loading = false
    }
  }
}).mount('#app')
</script>

</body>
</html>
