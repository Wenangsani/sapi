<!DOCTYPE html>
<html lang="id">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>404 - Halaman Tidak Ditemukan</title>
    <script src="https://cdn.tailwindcss.com"></script>
</head>
<body class="bg-gray-100 min-h-screen flex items-center justify-center px-4">

    <div class="max-w-lg w-full text-center">
        <div class="bg-white rounded-2xl shadow-lg p-10">
            <h1 class="text-8xl font-bold text-gray-800">404</h1>

            <h2 class="mt-4 text-2xl font-semibold text-gray-700">
                Halaman Tidak Ditemukan
            </h2>

            <p class="mt-3 text-gray-500">
                Maaf, halaman yang Anda cari tidak tersedia, telah dipindahkan,
                atau URL yang dimasukkan tidak valid.
            </p>

            <div class="mt-8">
                <a href="/"
                   class="inline-flex items-center px-6 py-3 bg-blue-600 text-white font-medium rounded-lg hover:bg-blue-700 transition">
                    Kembali ke Beranda
                </a>
            </div>
        </div>

        <p class="mt-6 text-sm text-gray-400">
            Error 404 • Not Found
        </p>
    </div>

</body>
</html>
